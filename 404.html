<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page non trouvée | HUMANREC</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--black);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
        }

        .error-code {
            font-family: 'Clash Display', sans-serif;
            font-size: clamp(8rem, 25vw, 15rem);
            line-height: 1;
            color: var(--red);
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Clash Display', sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            letter-spacing: 0.1em;
            margin-bottom: 20px;
        }

        p {
            color: var(--gray);
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 40px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 18px 40px;
            background: var(--red);
            color: var(--white);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: var(--red-dark);
            transform: translateY(-3px);
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="images/logo.webp" alt="HUMAN REC" class="logo-img"
            style="height: 60px; width: auto; margin-bottom: 30px;">
        <div class="error-code">404</div>
        <h1>Page non trouvée</h1>
        <p>
            Oups ! La page que vous recherchez n'existe pas ou a été déplacée.
            Pas de panique, retournez à l'accueil pour continuer votre visite.
        </p>
        <a href="/" class="btn">
            Retour à l'accueil
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 12h14M12 5l7 7-7 7" />
            </svg>
        </a>
    </div>
</body>

</html>
